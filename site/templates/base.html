<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}teilAuto Moessingen{% endblock title %}</title>
        <link rel="stylesheet" href="tailwind.css">
        <link rel="stylesheet" href="base.css">
        {% block head %}{% endblock head %}
    </head>
    <body class="min-h-screen bg-white text-slate-900">
        <a class="sr-only focus:not-sr-only focus:relative focus:mx-4 focus:my-2 focus:inline-flex focus:rounded-full focus:bg-white focus:px-3 focus:py-2" href="#main-content">Zum Inhalt springen</a>
        <div class="min-h-screen flex flex-col">
            <header class="border-b border-slate-200 bg-white">
                {% block header %}{% include "partials/header.html" %}{% endblock header %}
            </header>
            <main id="main-content" class="flex-1">
                <div class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
                    {% block main %}{% endblock main %}
                </div>
            </main>
            <footer class="border-t border-slate-200 bg-slate-50">
                {% block footer %}{% include "partials/footer.html" %}{% endblock footer %}
            </footer>
        </div>
        <script src="js/nav.js" defer></script>
    </body>
</html>
