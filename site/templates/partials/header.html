<div class="mx-auto flex w-full max-w-5xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
  <!-- Logo -->
  <a class="font-display text-xl font-bold tracking-wide text-brand-primary" href="index.html">teilAuto Mössingen</a>

  <!-- Hamburger button (visible below lg) -->
  <button
    class="inline-flex items-center justify-center rounded-full border border-brand-primary px-3 py-2 text-sm font-semibold text-brand-primary transition hover:bg-brand-muted lg:hidden"
    type="button"
    aria-controls="primary-nav"
    aria-expanded="false"
    aria-label="Navigationsmenü öffnen"
  >
    Menü
  </button>

  <!-- Desktop navigation (visible lg+) -->
  <nav
    id="primary-nav-desktop"
    class="hidden lg:flex lg:items-center lg:gap-6"
    aria-label="Hauptnavigation"
  >
    <a
      href="preise.html"
      {% if current_page == "preise" %}aria-current="page"{% endif %}
      class="text-sm font-medium text-brand-ink transition hover:text-brand-primary aria-[current=page]:rounded-full aria-[current=page]:bg-brand-muted aria-[current=page]:px-3 aria-[current=page]:py-1"
    >Preise</a>
    <a
      href="fahrzeuge.html"
      {% if current_page == "fahrzeuge" %}aria-current="page"{% endif %}
      class="text-sm font-medium text-brand-ink transition hover:text-brand-primary aria-[current=page]:rounded-full aria-[current=page]:bg-brand-muted aria-[current=page]:px-3 aria-[current=page]:py-1"
    >Fahrzeuge</a>
    <a
      href="geschaeftskunden.html"
      {% if current_page == "geschaeftskunden" %}aria-current="page"{% endif %}
      class="text-sm font-medium text-brand-ink transition hover:text-brand-primary aria-[current=page]:rounded-full aria-[current=page]:bg-brand-muted aria-[current=page]:px-3 aria-[current=page]:py-1"
    >Für Firmen</a>
    <a
      href="ueber-uns.html"
      {% if current_page == "ueber-uns" %}aria-current="page"{% endif %}
      class="text-sm font-medium text-brand-ink transition hover:text-brand-primary aria-[current=page]:rounded-full aria-[current=page]:bg-brand-muted aria-[current=page]:px-3 aria-[current=page]:py-1"
    >Über uns</a>
    <div class="flex items-center gap-3">
      <a href="tel:+4974739222020"
         class="rounded-full bg-brand-primary px-4 py-2 text-sm font-semibold text-white transition hover:bg-brand-accent">07473-922202</a>
      <a href="mitglied-werden.html"
         {% if current_page == "mitglied-werden" %}aria-current="page"{% endif %}
         class="rounded-full bg-brand-primary px-5 py-2 text-sm font-semibold text-white transition hover:bg-brand-accent">Mitglied werden</a>
    </div>
  </nav>

  <!-- Mobile navigation overlay (below lg) -->
  <div
    id="primary-nav"
    class="fixed inset-0 z-50 hidden flex-col items-center justify-center bg-brand-surface"
    aria-label="Mobile Navigation"
  >
    <!-- Organic decoration blob -->
    <div class="pointer-events-none absolute bottom-0 left-0 h-48 w-48 rounded-full bg-brand-primary/8"></div>

    <!-- Close button -->
    <button
      class="absolute right-4 top-4 rounded-full p-2 text-brand-ink transition hover:text-brand-primary"
      type="button"
      aria-label="Navigationsmenü schließen"
      onclick="document.getElementById('primary-nav').classList.add('hidden');document.getElementById('primary-nav').classList.remove('flex');document.querySelector('[aria-controls=primary-nav]').setAttribute('aria-expanded','false')"
    >
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Mobile nav links -->
    <nav class="flex flex-col items-center gap-4" aria-label="Hauptnavigation">
      <a href="index.html"
         {% if current_page == "index" %}aria-current="page"{% endif %}
         class="rounded-full bg-brand-muted px-6 py-3 text-center font-display text-base font-semibold text-brand-ink transition hover:text-brand-primary">Startseite</a>
      <a href="preise.html"
         {% if current_page == "preise" %}aria-current="page"{% endif %}
         class="rounded-full bg-brand-muted px-6 py-3 text-center font-display text-base font-semibold text-brand-ink transition hover:text-brand-primary">Preise</a>
      <a href="fahrzeuge.html"
         {% if current_page == "fahrzeuge" %}aria-current="page"{% endif %}
         class="rounded-full bg-brand-muted px-6 py-3 text-center font-display text-base font-semibold text-brand-ink transition hover:text-brand-primary">Fahrzeuge</a>
      <a href="geschaeftskunden.html"
         {% if current_page == "geschaeftskunden" %}aria-current="page"{% endif %}
         class="rounded-full bg-brand-muted px-6 py-3 text-center font-display text-base font-semibold text-brand-ink transition hover:text-brand-primary">Für Firmen</a>
      <a href="ueber-uns.html"
         {% if current_page == "ueber-uns" %}aria-current="page"{% endif %}
         class="rounded-full bg-brand-muted px-6 py-3 text-center font-display text-base font-semibold text-brand-ink transition hover:text-brand-primary">Über uns</a>
      <a href="mitglied-werden.html"
         {% if current_page == "mitglied-werden" %}aria-current="page"{% endif %}
         class="rounded-full bg-brand-muted px-6 py-3 text-center font-display text-base font-semibold text-brand-ink transition hover:text-brand-primary">Mitglied werden</a>
      <a href="tel:+4974739222020"
         class="mt-4 rounded-full bg-brand-primary px-8 py-3 text-base font-semibold text-white shadow-md transition hover:bg-brand-accent">Jetzt anrufen: 07473-922202</a>
    </nav>
  </div>
</div>
