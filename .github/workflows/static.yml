# Deploy pre-built design review site to GitHub Pages
# This workflow serves pre-built static files (no build step needed).
# All 4 design versions are committed as dist/v0-v3 subdirectories.
name: Deploy design review to Pages

on:
  push:
    branches: ["dhbw/publish"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  SITE_DIR: site
  BUILD_OUTPUT_DIR: build/dist

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload pre-built files as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}/${{ env.BUILD_OUTPUT_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
