# Build & deploy the marketing site to GitHub Pages
name: Deploy marketing site to Pages

on:
  push:
    branches: ["dhbw/publish"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  SITE_DIR: site

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ env.SITE_DIR }}/package-lock.json
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install tera CLI
        run: cargo install --git https://github.com/chevdor/tera-cli --locked
      - name: Install npm dependencies
        run: npm ci
        working-directory: ${{ env.SITE_DIR }}
      - name: Build static files
        run: npm run build
        working-directory: ${{ env.SITE_DIR }}
      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}/build/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
